# Builds the scheduled-jobs image and pushes it to Docker Hub.
#
# Only the cron image. The website is deployed separately, and this image
# deliberately serves no traffic -- it exists so Coolify has something to run
# the vault's nightly and price-sync jobs inside.
#
# NO SECRETS ARE NEEDED TO BUILD IT. src/lib/prisma.ts no longer throws during
# a build, and Dockerfile.cron carries a placeholder URL for prisma generate,
# so DATABASE_URL and TWELVE_DATA_API_KEY stay runtime-only and are set in
# Coolify. Only the registry credentials are secret here.
name: Cron image

on:
  push:
    branches: [main]
  # Lets you build from any branch out of the Actions tab, which is how you
  # test this before merging.
  workflow_dispatch:

# A newer commit makes an in-flight build pointless.
concurrency:
  group: cron-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cron
          push: true
          # Contabo is x86_64. Building arm64 as well would double the time
          # for an image nothing runs on a Pi.
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/acredis-cron:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/acredis-cron:${{ github.sha }}
          # Layer cache between runs: npm install is most of the build.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${{ secrets.DOCKERHUB_USERNAME }}/acredis-cron:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "and \`:${{ github.sha }}\` for rollback." >> $GITHUB_STEP_SUMMARY
